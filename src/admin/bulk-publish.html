<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Bulk Publish — Content Admin</title>
</head>
<body>
  <div id="bulk-publish-root"></div>

  <script>
    // Standalone, zero-framework page -- deliberately NOT injected into
    // Decap's own /admin React UI (no supported extension point exists
    // for adding a button/panel to Decap's own screens; preview-status.js
    // deliberately only ever adds an overlay banner on top, never touches
    // Decap's own DOM tree, for the same reason). This page reuses the
    // already-logged-in editor's own GitHub token instead of running its
    // own login flow -- see getToken() below.
    //
    // Three states, driven entirely by what GET /admin/bulk-publish-api
    // reports (no client-side state machine of its own beyond what's
    // needed for one in-flight request):
    //   1. bulkModeOn: false                -> "Enable Bulk Mode"
    //   2. bulkModeOn: true,  scratch: null  -> picklist + "Combine & Preview"
    //   3. bulkModeOn: true,  scratch: {...} -> combined branches + preview
    //      link + "Publish This" / "Abandon"
    (function () {
      const root = document.getElementById('bulk-publish-root');

      // Bumped at the top of load() and wherever else the page navigates
      // to a different view -- any in-flight poll loop (scratch preview
      // building, production deployment after Publish) checks its own
      // stamped generation before acting and silently gives up if it's
      // been superseded. Same pattern preview-status.js already uses for
      // exactly the same reason: without it, clicking Abandon/Publish
      // while an earlier poll is still in flight would let that stale
      // loop overwrite whatever the newer action just rendered.
      let generation = 0;

      function el(tag, attrs, children) {
        const node = document.createElement(tag);
        if (attrs) {
          for (const [k, v] of Object.entries(attrs)) {
            if (k === 'style') node.style.cssText = v;
            else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
            else node.setAttribute(k, v);
          }
        }
        (children || []).forEach((c) => node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
        return node;
      }

      // Decap CMS persists the OAuth token it obtained via
      // functions/auth.js/callback.js into localStorage under the key
      // decap-cms-user, for its own session-reuse purposes. This key and
      // its shape are Decap's own internal, UNDOCUMENTED storage format
      // (not vendored/pinned in the consuming repo -- Decap loads from
      // unpkg.com's CDN, not npm), observed rather than guaranteed stable
      // across Decap versions. Degrading to "treat as not logged in"
      // rather than throwing on any parse surprise is deliberate, not an
      // oversight -- a future Decap upgrade changing this shape should
      // fail safe here, not break this page outright.
      function getToken() {
        try {
          const raw = localStorage.getItem('decap-cms-user');
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          return parsed && parsed.token ? parsed.token : null;
        } catch (e) {
          return null;
        }
      }

      function relativeTime(iso) {
        const diffMs = Date.now() - new Date(iso).getTime();
        const mins = Math.round(diffMs / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return `${mins}m ago`;
        const hours = Math.round(mins / 60);
        if (hours < 24) return `${hours}h ago`;
        return `${Math.round(hours / 24)}d ago`;
      }

      async function api(action, body) {
        const token = getToken();
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers.Authorization = `Bearer ${token}`;
        const res = await fetch('/admin/bulk-publish-api', {
          method: action ? 'POST' : 'GET',
          headers,
          body: action ? JSON.stringify(Object.assign({ action }, body)) : undefined,
        });
        const data = await res.json();
        return { ok: res.ok, status: res.status, data };
      }

      function renderLoggedOut() {
        root.innerHTML = '';
        root.appendChild(
          el('div', { style: 'font:14px -apple-system,sans-serif;padding:24px;max-width:520px;' }, [
            el('p', {}, ['You need to be logged into /admin first — this page reuses that session.']),
            el('a', { href: '/admin' }, ['Go to /admin →']),
          ])
        );
      }

      function renderError(message) {
        const banner = document.getElementById('bulk-publish-error');
        if (banner) banner.remove();
        root.prepend(
          el(
            'div',
            {
              id: 'bulk-publish-error',
              style:
                'background:#4a1414;color:#ffb4b4;padding:12px 16px;font:14px -apple-system,sans-serif;' +
                'border-radius:4px;margin-bottom:16px;white-space:pre-wrap;',
            },
            [message]
          )
        );
      }

      function renderOff() {
        root.innerHTML = '';
        root.appendChild(
          el('div', { style: 'font:14px -apple-system,sans-serif;padding:24px;max-width:520px;' }, [
            el('h1', { style: 'font-size:18px;margin:0 0 12px;' }, ['Bulk Publish']),
            el('p', { style: 'color:#666;' }, [
              'Enable Bulk Mode to make several edits without triggering a build for each one. ',
              'While it’s on, no preview or production build fires for anything — not just what you edit here, but every Save from anyone. ',
              'When you’re done, come back here to combine, preview, and publish.',
            ]),
            el(
              'button',
              {
                style:
                  'background:#1a1a1a;color:#fff;border:none;padding:10px 18px;border-radius:4px;' +
                  'font-size:14px;cursor:pointer;',
                onclick: async (e) => {
                  e.target.disabled = true;
                  e.target.textContent = 'Enabling…';
                  const { ok, data } = await api('enable');
                  if (!ok) {
                    e.target.disabled = false;
                    e.target.textContent = 'Enable Bulk Mode';
                    renderError(data.error || 'failed to enable bulk mode');
                    return;
                  }
                  load();
                },
              },
              ['Enable Bulk Mode']
            ),
          ])
        );
      }

      function renderPicklist(repo, prs) {
        root.innerHTML = '';

        const banner = el(
          'div',
          {
            style:
              'background:#1a1a1a;color:#fff;padding:10px 16px;border-radius:4px;font:14px -apple-system,sans-serif;' +
              'margin-bottom:16px;',
          },
          ['Bulk Mode is ON — builds are suspended until you publish or turn it off.']
        );

        const container = el('div', { style: 'font:14px -apple-system,sans-serif;padding:24px;max-width:640px;' });
        container.appendChild(banner);
        container.appendChild(el('h1', { style: 'font-size:18px;margin:0 0 12px;' }, ['Bulk Publish']));

        if (prs.length === 0) {
          container.appendChild(
            el('p', { style: 'color:#666;' }, [
              'No open cms/* PRs right now. Make some edits in ',
              el('a', { href: '/admin' }, ['/admin']),
              ', then come back here.',
            ])
          );
        }

        const checkboxes = [];
        prs.forEach((pr) => {
          const checkbox = el('input', { type: 'checkbox', value: pr.branch });
          checkboxes.push(checkbox);
          const row = el(
            'label',
            {
              style:
                'display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eee;',
            },
            [
              checkbox,
              el('span', { style: 'flex:1;' }, [pr.title]),
              el('code', { style: 'color:#888;font-size:12px;' }, [pr.branch]),
              el('span', { style: 'color:#999;font-size:12px;white-space:nowrap;' }, [
                `${pr.author || 'unknown'} · ${relativeTime(pr.updatedAt)}`,
              ]),
            ]
          );
          container.appendChild(row);
        });

        const combineBtn = el(
          'button',
          {
            style:
              'background:#1a1a1a;color:#fff;border:none;padding:10px 18px;border-radius:4px;' +
              'font-size:14px;cursor:pointer;margin-top:16px;margin-right:10px;opacity:0.5;',
            disabled: 'true',
          },
          ['Combine & Preview']
        );

        function refreshCombineState() {
          const anyChecked = checkboxes.some((c) => c.checked);
          combineBtn.disabled = !anyChecked;
          combineBtn.style.opacity = anyChecked ? '1' : '0.5';
        }
        checkboxes.forEach((c) => c.addEventListener('change', refreshCombineState));

        combineBtn.addEventListener('click', async () => {
          const selected = checkboxes.filter((c) => c.checked).map((c) => c.value);
          if (selected.length === 0) return;

          combineBtn.disabled = true;
          combineBtn.textContent = 'Combining…';
          const { ok, data } = await api('combine', { branches: selected });

          if (!ok) {
            let msg = data.error || 'combine failed';
            if (data.conflictedBranch) msg += `\nConflicted branch: ${data.conflictedBranch}`;
            if (data.scratchBranch) msg += `\nScratch branch (left in place): ${data.scratchBranch}`;
            if (data.alreadyMerged && data.alreadyMerged.length) msg += `\nAlready merged before the failure: ${data.alreadyMerged.join(', ')}`;
            renderError(msg);
            combineBtn.disabled = false;
            combineBtn.textContent = 'Combine & Preview';
            return;
          }

          load();
        });

        const cancelBtn = el(
          'button',
          {
            style:
              'background:none;color:#666;border:1px solid #ccc;padding:10px 18px;border-radius:4px;' +
              'font-size:14px;cursor:pointer;margin-top:16px;',
            onclick: async (e) => {
              e.target.disabled = true;
              const { ok, data } = await api('disable');
              if (!ok) {
                e.target.disabled = false;
                renderError(data.error || 'failed to turn off bulk mode');
                return;
              }
              load();
            },
          },
          ['Turn Off Bulk Mode (don’t publish anything)']
        );

        container.appendChild(combineBtn);
        container.appendChild(cancelBtn);
        root.appendChild(container);
      }

      function renderScratchPreview(repo, scratch) {
        root.innerHTML = '';

        const banner = el(
          'div',
          {
            style:
              'background:#1a1a1a;color:#fff;padding:10px 16px;border-radius:4px;font:14px -apple-system,sans-serif;' +
              'margin-bottom:16px;',
          },
          ['Bulk Mode is ON — previewing a combined result before publishing.']
        );

        const container = el('div', { style: 'font:14px -apple-system,sans-serif;padding:24px;max-width:640px;' });
        container.appendChild(banner);
        container.appendChild(el('h1', { style: 'font-size:18px;margin:0 0 12px;' }, ['Review before publishing']));

        container.appendChild(
          el('p', {}, [
            `Combining ${scratch.combinedBranches.length} ${scratch.combinedBranches.length === 1 ? 'entry' : 'entries'}: `,
            el('code', {}, [scratch.combinedBranches.join(', ')]),
          ])
        );

        const PREVIEW_STATUS_TEXT = {
          building: '⏳ Building preview…',
          success: '✅ Preview ready',
          failure: '❌ Preview build failed',
          not_found: '⏳ Waiting for build to start…',
        };

        const previewRow = el('p', {}, []);
        container.appendChild(previewRow);

        function renderPreviewStatus(preview) {
          previewRow.innerHTML = '';
          previewRow.appendChild(document.createTextNode(PREVIEW_STATUS_TEXT[preview.status] || preview.status));
          if (preview.url) {
            previewRow.appendChild(document.createTextNode(' — '));
            previewRow.appendChild(
              el('a', { href: preview.url, target: '_blank', rel: 'noopener noreferrer' }, ['Open preview →'])
            );
          }
        }
        renderPreviewStatus(scratch.preview);

        // Auto-refresh while the scratch branch's own preview build is
        // still in flight -- same reasoning/shape as preview-status.js's
        // poll loop for ordinary Decap saves, just polling this page's
        // own GET instead of preview-url.js. Stops on its own once the
        // build settles (success/failure) or after ~2 minutes; also
        // bails immediately, doing a full reload instead, if the scratch
        // branch this loop was watching isn't the active one anymore
        // (published/abandoned from elsewhere, e.g. another tab).
        if (scratch.preview.status === 'building' || scratch.preview.status === 'not_found') {
          const myGeneration = ++generation;
          (async function poll(attempt) {
            if (myGeneration !== generation) return;
            await new Promise((resolve) => setTimeout(resolve, 5000));
            if (myGeneration !== generation) return;

            const { ok, data } = await api(null);
            if (myGeneration !== generation) return;
            if (!ok || !data.scratch || data.scratch.branch !== scratch.branch) {
              load();
              return;
            }

            renderPreviewStatus(data.scratch.preview);
            if (data.scratch.preview.status === 'building' || data.scratch.preview.status === 'not_found') {
              if (attempt < 24) poll(attempt + 1);
              else previewRow.appendChild(el('span', { style: 'color:#666;font-size:12px;' }, [' (still building after 2 minutes — check back later)']));
            }
          })(0);
        }

        const publishBtn = el(
          'button',
          {
            style:
              'background:#1a1a1a;color:#fff;border:none;padding:10px 18px;border-radius:4px;' +
              'font-size:14px;cursor:pointer;margin-top:16px;margin-right:10px;',
          },
          ['Publish This']
        );
        publishBtn.addEventListener('click', async () => {
          const confirmed = confirm(
            `Publish ${scratch.combinedBranches.length} ${scratch.combinedBranches.length === 1 ? 'entry' : 'entries'}? This will trigger one production build.`
          );
          if (!confirmed) return;

          publishBtn.disabled = true;
          publishBtn.textContent = 'Publishing…';
          const { ok, data } = await api('publish-scratch', { scratchBranch: scratch.branch });

          if (!ok) {
            renderError(data.error || 'publish failed');
            publishBtn.disabled = false;
            publishBtn.textContent = 'Publish This';
            return;
          }

          renderPublished(repo, data);
        });

        const abandonBtn = el(
          'button',
          {
            style:
              'background:none;color:#a66;border:1px solid #a66;padding:10px 18px;border-radius:4px;' +
              'font-size:14px;cursor:pointer;margin-top:16px;',
          },
          ['Abandon (don’t publish, pick again)']
        );
        abandonBtn.addEventListener('click', async () => {
          const confirmed = confirm('Discard this combined preview? The individual entries stay open — you can pick a different combination afterward.');
          if (!confirmed) return;

          abandonBtn.disabled = true;
          abandonBtn.textContent = 'Abandoning…';
          const { ok, data } = await api('abandon-scratch', { scratchBranch: scratch.branch });
          if (!ok) {
            renderError(data.error || 'failed to abandon');
            abandonBtn.disabled = false;
            abandonBtn.textContent = 'Abandon (don’t publish, pick again)';
            return;
          }
          load();
        });

        container.appendChild(publishBtn);
        container.appendChild(abandonBtn);
        root.appendChild(container);
      }

      // Shown right after Publish This succeeds. The merge itself is
      // already done at this point (published/mainMergeSha are real),
      // but Cloudflare's actual production BUILD for that commit is
      // still in flight -- this polls for it the same way
      // renderScratchPreview polls the scratch branch's own preview,
      // rather than declaring victory the instant the merge API call
      // returns. No generation-guard needed here (unlike
      // renderScratchPreview's poll): this is the terminal view for this
      // whole flow, nothing else can render over it except a fresh
      // load(), which already bumps generation itself.
      function renderPublished(repo, data) {
        const myGeneration = ++generation;
        const PRODUCTION_STATUS_TEXT = {
          building: '⏳ Deploying to production…',
          success: '✅ Live in production',
          failure: '❌ Production build failed — the merge succeeded, but the site itself didn’t deploy. Check Cloudflare directly.',
          not_found: '⏳ Waiting for the production build to start…',
        };
        const productionRow = el('p', {}, [PRODUCTION_STATUS_TEXT.not_found]);

        root.innerHTML = '';
        root.appendChild(
          el('div', { style: 'font:14px -apple-system,sans-serif;padding:24px;max-width:640px;' }, [
            el('h1', { style: 'font-size:18px;margin:0 0 12px;' }, ['Published']),
            el('p', {}, [`Combined and published ${data.published.length} entr${data.published.length === 1 ? 'y' : 'ies'}: ${data.published.join(', ')}`]),
            el('p', {}, [
              'Commit: ',
              el('a', { href: `https://github.com/${repo}/commit/${data.mainMergeSha}`, target: '_blank', rel: 'noopener noreferrer' }, [data.mainMergeSha]),
            ]),
            productionRow,
            el('p', { style: 'color:#666;' }, ['Bulk Mode is back off — normal preview builds resume for future edits.']),
            (data.warnings && data.warnings.length
              ? el('p', { style: 'color:#a66;' }, [`Warnings: ${data.warnings.join('; ')}`])
              : el('span', {}, [])),
          ])
        );

        (async function poll(attempt) {
          if (myGeneration !== generation) return;
          const res = await fetch(`/admin/bulk-publish-api?productionSha=${encodeURIComponent(data.mainMergeSha)}`);
          if (myGeneration !== generation) return;
          let production;
          try {
            production = (await res.json()).production;
          } catch (e) {
            production = null;
          }
          if (!production) return; // transient fetch/parse hiccup -- next tick will retry

          productionRow.innerHTML = '';
          productionRow.appendChild(document.createTextNode(PRODUCTION_STATUS_TEXT[production.status] || production.status));
          if (production.url) {
            productionRow.appendChild(document.createTextNode(' — '));
            productionRow.appendChild(
              el('a', { href: production.url, target: '_blank', rel: 'noopener noreferrer' }, ['Open →'])
            );
          }

          if (production.status === 'building' || production.status === 'not_found') {
            if (attempt < 24) setTimeout(() => poll(attempt + 1), 5000);
            else productionRow.appendChild(el('span', { style: 'color:#666;font-size:12px;' }, [' (still building after 2 minutes — check Cloudflare directly)']));
          }
        })(0);
      }

      async function load() {
        generation++; // supersede any poll loop left running from a previous view
        root.innerHTML = '<div style="font:14px -apple-system,sans-serif;padding:24px;">Loading…</div>';

        if (!getToken()) {
          renderLoggedOut();
          return;
        }

        const { ok, data } = await api(null);
        if (!ok) {
          renderError(data.error || 'failed to load bulk publish state');
          return;
        }

        if (!data.bulkModeOn) {
          renderOff();
        } else if (data.scratch) {
          renderScratchPreview(data.repo, data.scratch);
        } else {
          renderPicklist(data.repo, data.prs || []);
        }
      }

      load();
    })();
  </script>
</body>
</html>
